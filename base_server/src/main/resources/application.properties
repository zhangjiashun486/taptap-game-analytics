spring.application.name=base_server
server.port=8080

spring.datasource.url=jdbc:mysql://192.168.100.101:3306/taptap_course?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${TAPTAP_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# ---------- MyBatis ----------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.base_server.entity
mybatis.configuration.map-underscore-to-camel-case=true

admin.username=admin
admin.password=${ADMIN_PASSWORD:change-me}

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:please-change-me}
jwt.expire-hours=24

deepseek.enabled=${DEEPSEEK_ENABLED:false}
deepseek.key=${DEEPSEEK_API_KEY:}
deepseek.url=${DEEPSEEK_URL:https://api.deepseek.com/chat/completions}
deepseek.model.chat=${DEEPSEEK_MODEL_CHAT:deepseek-chat}
deepseek.model.reasoner=${DEEPSEEK_MODEL_REASONER:deepseek-reasoner}
deepseek.timeout=${DEEPSEEK_TIMEOUT:60000}
deepseek.max-tokens=${DEEPSEEK_MAX_TOKENS:800}

crawl.execution.mode=${CRAWL_EXECUTION_MODE:PYTHON}
crawl.python.executable=${CRAWL_PYTHON_EXECUTABLE:python}
crawl.script.path=${CRAWL_SCRIPT_PATH:../data_server/jobs/crawler/demo_task_runner.py}
crawl.demo.limit=${CRAWL_DEMO_LIMIT:20}
crawl.timeout-minutes=${CRAWL_TIMEOUT_MINUTES:10}
# ----------  Text-to-SQL  ----------
qa.sql-agent.enabled=${QA_SQL_AGENT_ENABLED:true}
qa.sql-agent.url=${QA_SQL_AGENT_URL:jdbc:mysql://192.168.100.101:3306/taptap_course?useUnicode=true&characterEncoding=UTF-8&useSSL=false}
qa.sql-agent.username=${QA_SQL_AGENT_USER:taptap_ai}
qa.sql-agent.password=${QA_SQL_AGENT_PASSWORD:${TAPTAP_DB_PASSWORD:}}
qa.sql-agent.max-rows=${QA_SQL_AGENT_MAX_ROWS:50}
qa.sql-agent.timeout-seconds=${QA_SQL_AGENT_TIMEOUT_SECONDS:5}