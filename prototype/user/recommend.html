  var box=document.getElementById(el); box.innerHTML='';

      (x.r?'<p class="muted" style="margin-top:6px;font-size:12px;background:#f9f9f9;border-radius:8px;padding:6px 8px;">💡 '+x.r+'</p>':'<div class="muted" style="font-size:12px;margin-top:6px;">'+x.f+'</div>')+
